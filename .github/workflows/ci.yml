# ==============================================================================
# .github/workflows/ci.yml
# ------------------------------------------------------------------------------
# PURPOSE
#   Continuous Integration: GitHub runs this automatically on every push and pull request.
#
# DETAILS
#   Two jobs run in parallel:
#     1. python    -> installs the dev dependencies and runs the whole pytest suite.
#     2. terraform -> checks formatting (fmt) and that the configuration is valid.
#   A green check on GitHub means both passed. No AWS credentials are used here.
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
        working-directory: rootTerraformCode
      - run: terraform validate
        working-directory: rootTerraformCode
